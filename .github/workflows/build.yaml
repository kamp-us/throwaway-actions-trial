name: build
on:
  pull_request:
  merge_group:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "event=${{ github.event_name }} sha=${{ github.sha }} ref=${{ github.ref }}"
          if [ "${{ github.event_name }}" = merge_group ]; then
            sleep "$(cat SLEEP 2>/dev/null || echo 20)"
            if [ -e FAIL ]; then echo "FAIL file present"; exit 1; fi
          fi
